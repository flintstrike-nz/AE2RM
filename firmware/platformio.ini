; AE2RM ESP32 port - PlatformIO project
; Target: ESP32-S3 2.8" board, ES3C28P ("Xiaozhi") variant
;   - 240x320 SPI TFT, ILI9341 driver
;   - FT6336 capacitive touch (I2C)
;   - MicroSD via SD/MMC (used for game assets)
;
; default_16MB.csv gives two OTA app slots (app0/app1), so an OTA write
; lands on the inactive slot rather than overwriting the running one --
; but nothing here configures ESP-IDF bootloader rollback or app-side
; image validation, so a bad image that still boots will stay selected;
; USB is the recovery path if that happens. See README.md for
; first-flash-over-USB, then-OTA instructions.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; PSRAM/flash layout for a 16MB module
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    ; Route Serial to the S3's built-in USB (Serial/JTAG) so Serial.print()
    ; from the sketch shows up on `pio device monitor` over the same cable
    ; used to flash -- without this, only the ESP-IDF/HAL logs are visible
    ; there and the sketch's own logging goes to (unconnected) UART0.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    lovyan03/LovyanGFX@^1.1.16

; Wireless updates, once the board has been flashed once over USB and is on
; your WiFi (see include/secrets.h.example). Point upload_port at the
; board -- its mDNS name (printed on the serial log at boot) usually
; resolves, but not on every network/router; use its IP if it doesn't:
;   pio run -e esp32-s3-devkitc-1-ota -t upload
;   pio run -e esp32-s3-devkitc-1-ota -t upload --upload-port 192.168.1.42
[env:esp32-s3-devkitc-1-ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = ae2rm.local
