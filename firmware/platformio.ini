; AE2RM ESP32 port - PlatformIO project
; Target: ESP32-S3 2.8" ILI9341 board (diymore ES3C28P / ES3N28P family)
;   - 240x320 SPI TFT, ILI9341V driver
;   - FT6336G capacitive touch (I2C), ES3C28P variant only
;   - MicroSD card slot (used for game assets)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; PSRAM/flash layout for a 16MB module
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
